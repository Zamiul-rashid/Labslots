[project]
name = "labslots"
version = "0.2.0"
description = "Slot scheduler and admin desk for the Headscale lab pilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "authlib==1.5.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labslots*"]

[tool.setuptools.package-data]
labslots = ["templates/*.html", "static/*", "pc/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
